name: Bump Version Everywhere

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: Version part to increment
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  bump-version:
    name: Increment and synchronize all version files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Increment the single source version
        id: version
        env:
          BUMP_TYPE: ${{ inputs.bump_type }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const read = (file) => JSON.parse(fs.readFileSync(file, 'utf8'));
          const write = (file, value) => fs.writeFileSync(file, JSON.stringify(value, null, 2) + '\n');

          const packageJson = read('package.json');
          const lock = read('package-lock.json');
          const manifest = read('prayer-focus-v2/manifest.json');
          const current = packageJson.version;

          if (!/^\d+\.\d+\.\d+$/.test(current)) {
            throw new Error('package.json version must use MAJOR.MINOR.PATCH semver.');
          }

          const [major, minor, patch] = current.split('.').map(Number);
          const next = process.env.BUMP_TYPE === 'major'
            ? `${major + 1}.0.0`
            : process.env.BUMP_TYPE === 'minor'
              ? `${major}.${minor + 1}.0`
              : `${major}.${minor}.${patch + 1}`;

          packageJson.version = next;
          lock.version = next;
          lock.packages[''].version = next;
          manifest.version = next;

          write('package.json', packageJson);
          write('package-lock.json', lock);
          write('prayer-focus-v2/manifest.json', manifest);

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${next}\nprevious=${current}\n`);
          console.log(`Version bumped: ${current} -> ${next}`);
          NODE

      - name: Verify all version sources match
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          LOCK_VERSION="$(node -p "require('./package-lock.json').version")"
          LOCK_ROOT_VERSION="$(node -p "require('./package-lock.json').packages[''].version")"
          EXTENSION_VERSION="$(node -p "require('./prayer-focus-v2/manifest.json').version")"

          echo "package.json: $PACKAGE_VERSION"
          echo "package-lock.json: $LOCK_VERSION"
          echo "package-lock root: $LOCK_ROOT_VERSION"
          echo "extension manifest: $EXTENSION_VERSION"

          test "$PACKAGE_VERSION" = "$LOCK_VERSION"
          test "$PACKAGE_VERSION" = "$LOCK_ROOT_VERSION"
          test "$PACKAGE_VERSION" = "$EXTENSION_VERSION"

      - name: Commit and push synchronized version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.version.outputs.version }}
          OLD_VERSION: ${{ steps.version.outputs.previous }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json prayer-focus-v2/manifest.json
          git commit -m "chore: bump all app versions from v$OLD_VERSION to v$NEW_VERSION"
          git push origin HEAD:main

      - name: Summary
        env:
          OLD_VERSION: ${{ steps.version.outputs.previous }}
          NEW_VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "## Prayer Focus version updated"
            echo
            echo "**Previous:** v$OLD_VERSION"
            echo
            echo "**New:** v$NEW_VERSION"
            echo
            echo "The push to main automatically starts the production build, extension ZIP packaging, GitHub Release, and website deployment."
          } >> "$GITHUB_STEP_SUMMARY"
