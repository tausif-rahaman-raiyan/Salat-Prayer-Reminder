name: Build Website, Extension Package & Deploy Website

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build & Package Prayer Focus
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Project Dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Test Suite & Linter
        run: |
          npm run lint
          node prayer-focus-v2/tests/prayer-engine.test.js

      - name: Generate One Release Version
        id: compute_version
        run: |
          VERSION="2.2.${{ github.run_number }}"
          export VERSION
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_TAG=v$VERSION" >> "$GITHUB_ENV"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          node -e "const fs=require('fs'); const p='./prayer-focus-v2/manifest.json'; const m=JSON.parse(fs.readFileSync(p,'utf8')); m.version=process.env.VERSION; fs.writeFileSync(p, JSON.stringify(m,null,2)+'\\n');"
          echo "Release version: v$VERSION"

      - name: Package Chrome Extension ZIPs
        run: |
          mkdir -p packages public
          cd prayer-focus-v2
          zip -qr "../packages/prayer-focus-${VERSION_TAG}.zip" . -x "tests/*"
          zip -qr "../packages/prayer-focus.zip" . -x "tests/*"
          cd ..
          cp "packages/prayer-focus-${VERSION_TAG}.zip" public/
          cp "packages/prayer-focus.zip" public/
          echo "Extension ZIPs packaged:"
          ls -lh packages/

      - name: Build Website With Matching Version
        run: npm run build

      - name: Copy Release ZIPs Into Build Artifacts
        run: |
          mkdir -p dist/packages
          cp "packages/prayer-focus-${VERSION_TAG}.zip" dist/packages/
          cp "packages/prayer-focus.zip" dist/packages/

      - name: Deploy to gh-pages branch (Fallback for branch deployment)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add -A
          git commit -m "deploy: production build v${VERSION}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages || true
          cd ..

      - name: Upload Extension ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: prayer-focus-extension-${{ env.VERSION_TAG }}
          path: dist/packages/prayer-focus-${{ env.VERSION_TAG }}.zip

      - name: Upload GitHub Pages Artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Create or Update GitHub Release With Extension ZIPs
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: "Prayer Focus ${{ env.VERSION_TAG }}"
          body: |
            ## 🕌 Prayer Focus ${{ env.VERSION_TAG }}
            Automated release of the Chrome extension and companion website.

            ### Included
            - Runtime-aware version detection (manifest/build version).
            - Strict Salah reminders until a prayer is honestly recorded.
            - Automatic missed status at each prayer's calculated end limit.
            - Rounded toolbar popup matching the dashboard preview.

            ### Install / update an unpacked extension
            1. Download `prayer-focus-${{ env.VERSION_TAG }}.zip`.
            2. Extract it over your existing extension folder.
            3. Open `chrome://extensions/` and click **Reload** on Prayer Focus.
            4. Existing prayer records and settings remain in Chrome storage.
          files: |
            dist/packages/prayer-focus-${{ env.VERSION_TAG }}.zip
            dist/packages/prayer-focus.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-website:
    name: Deploy Website to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Website to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
