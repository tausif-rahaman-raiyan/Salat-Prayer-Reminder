name: Build Website, Extension Package & Deploy Website

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build & Package Prayer Focus
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Project Dependencies
        run: npm install --legacy-peer-deps

      - name: Run Test Suite & Linter
        run: |
          npm run lint
          node prayer-focus-v2/tests/prayer-engine.test.js

      - name: Build Web Application
        run: npm run build

      - name: Deploy to gh-pages branch (Fallback for branch deployment)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add -A
          git commit -m "deploy: automatic production build for GitHub Pages"
          git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git gh-pages || true
          cd ..

      - name: Auto-increment Version Tag from GitHub Run Number
        id: compute_version
        run: |
          VERSION="2.1.${{ github.run_number }}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION_TAG=v$VERSION" >> $GITHUB_ENV
          echo "Computed Auto Version: v$VERSION"
          
          # Inject computed version into manifest.json for extension runner
          node -e "const fs = require('fs'); const path = './prayer-focus-v2/manifest.json'; const m = JSON.parse(fs.readFileSync(path)); m.version = '$VERSION'; fs.writeFileSync(path, JSON.stringify(m, null, 2));"

      - name: Package Chrome Extension ZIP
        run: |
          mkdir -p dist/packages
          cd prayer-focus-v2
          zip -r ../dist/packages/prayer-focus-${{ env.VERSION_TAG }}.zip ./* -x "tests/*"
          zip -r ../dist/packages/prayer-focus.zip ./* -x "tests/*"
          cd ..
          cp dist/packages/prayer-focus-${{ env.VERSION_TAG }}.zip public/prayer-focus-${{ env.VERSION_TAG }}.zip 2>/dev/null || true
          cp dist/packages/prayer-focus-${{ env.VERSION_TAG }}.zip dist/prayer-focus-${{ env.VERSION_TAG }}.zip 2>/dev/null || true
          cp dist/packages/prayer-focus.zip public/prayer-focus.zip 2>/dev/null || true
          cp dist/packages/prayer-focus.zip dist/prayer-focus.zip 2>/dev/null || true
          echo "Extension zip packaged successfully!"
          ls -lh dist/packages/

      - name: Upload Extension ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: prayer-focus-extension-${{ env.VERSION_TAG }}
          path: dist/packages/prayer-focus-${{ env.VERSION_TAG }}.zip

      - name: Upload GitHub Pages Artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Create or Update GitHub Release with Extension ZIP
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: "Prayer Focus ${{ env.VERSION_TAG }}"
          body: |
            ## 🕌 Prayer Focus ${{ env.VERSION_TAG }} Automated Release
            Automated production build of the Prayer Focus Chrome Extension (Manifest V3) & Companion Dashboard.
            
            ### ✨ Release Details:
            - **Auto-Incremented Release Tag**: `${{ env.VERSION_TAG }}`
            - **Build Run**: #${{ github.run_number }}
            - **Global City Autocomplete**: Instant search & timezone setup for any worldwide city.
            - **Current Prayer Window**: Live visual indicator for ongoing Salah.
            - **Version Checker**: In-app automatic update detection via GitHub Releases.
            
            ### 📦 Download & Install:
            - Download `prayer-focus-${{ env.VERSION_TAG }}.zip` or `prayer-focus.zip` attached below.
            - Extract the zip file.
            - In Chrome, open `chrome://extensions/` and enable **Developer Mode** (top-right).
            - Click **Load unpacked** (top-left) and select the folder that directly contains `manifest.json` (`prayer-focus-v2`).
          files: |
            dist/packages/prayer-focus-${{ env.VERSION_TAG }}.zip
            dist/packages/prayer-focus.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-website:
    name: Deploy Website to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
