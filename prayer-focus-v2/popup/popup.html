<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prayer Focus</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <img src="../assets/icons/icon32.png" alt="Prayer Focus" class="brand-img" style="width: 26px; height: 26px; object-fit: contain; filter: drop-shadow(0 0 6px rgba(52,211,153,0.5));">
        <div class="brand-text">
          <h1>Prayer Focus</h1>
          <span class="brand-tag">Pray • Focus • Grow</span>
        </div>
      </div>
      
      <div style="display: flex; align-items: center; gap: 8px;">
        <!-- EN/বাংলা toggle -->
        <div class="lang-switch-box" style="display: flex; background: rgba(0,0,0,0.4); border: 1px solid rgba(52,211,153,0.3); border-radius: 8px; padding: 2px;">
          <button id="btn-popup-en" style="background: #10b981; color: #022c22; border: none; padding: 2px 6px; border-radius: 6px; font-weight: 700; font-size: 10px; cursor: pointer;">EN</button>
          <button id="btn-popup-bn" style="background: transparent; color: #a7f3d0; border: none; padding: 2px 6px; border-radius: 6px; font-weight: 700; font-size: 10px; cursor: pointer;">বাংলা</button>
        </div>

        <div class="status-indicator" id="reminder-status-badge">
          <span class="dot"></span>
          <span class="status-text" id="status-label">Active</span>
        </div>
      </div>
    </header>
 
    <!-- Present Prayer Window Banner (When active) -->
    <div id="present-prayer-banner" style="display: none; background: rgba(16, 185, 129, 0.2); border: 1px solid #10b981; border-radius: 10px; padding: 6px 10px; margin-bottom: 8px; font-size: 11px; color: #d1fae5; align-items: center; justify-content: space-between;">
      <div style="display: flex; align-items: center; gap: 6px;">
        <span style="display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #10b981; box-shadow: 0 0 6px #34d399;"></span>
        <strong id="present-prayer-title">Present Window</strong>
      </div>
      <span id="present-prayer-time-range" style="font-weight: 600; color: #a7f3d0;">--</span>
    </div>

    <!-- Next Prayer Countdown Card -->
    <section class="next-prayer-card">
      <div class="card-top">
        <span class="label" id="label-next-prayer">Next Prayer</span>
        <span class="time-label" id="next-prayer-time">--:--</span>
      </div>
      <h2 class="prayer-name-display" id="next-prayer-name">Prayer</h2>
      <div id="next-prayer-limit" style="font-size: 11px; color: #a7f3d0; margin-bottom: 8px; font-weight: 500;">Time Limit: --:--</div>
      <div class="countdown-wrapper">
        <span class="countdown-label" id="label-time-left">Time Left:</span>
        <span class="countdown-digits" id="countdown-text">--:--:--</span>
      </div>
    </section>

    <!-- Quick Prayer Timings Grid with Limits -->
    <div class="prayer-grid" id="prayer-grid">
      <div class="grid-item" data-key="fajr">
        <span class="p-name" id="name-fajr">Fajr</span>
        <span class="p-time" id="time-fajr">--:--</span>
        <span class="p-limit" id="limit-fajr" style="font-size: 8.5px; color: #a7f3d0; opacity: 0.85; text-align: center; line-height: 1;">--</span>
      </div>
      <div class="grid-item" data-key="dhuhr">
        <span class="p-name" id="name-dhuhr">Dhuhr</span>
        <span class="p-time" id="time-dhuhr">--:--</span>
        <span class="p-limit" id="limit-dhuhr" style="font-size: 8.5px; color: #a7f3d0; opacity: 0.85; text-align: center; line-height: 1;">--</span>
      </div>
      <div class="grid-item" data-key="asr">
        <span class="p-name" id="name-asr">Asr</span>
        <span class="p-time" id="time-asr">--:--</span>
        <span class="p-limit" id="limit-asr" style="font-size: 8.5px; color: #a7f3d0; opacity: 0.85; text-align: center; line-height: 1;">--</span>
      </div>
      <div class="grid-item" data-key="maghrib">
        <span class="p-name" id="name-maghrib">Maghrib</span>
        <span class="p-time" id="time-maghrib">--:--</span>
        <span class="p-limit" id="limit-maghrib" style="font-size: 8.5px; color: #a7f3d0; opacity: 0.85; text-align: center; line-height: 1;">--</span>
      </div>
      <div class="grid-item" data-key="isha">
        <span class="p-name" id="name-isha">Isha</span>
        <span class="p-time" id="time-isha">--:--</span>
        <span class="p-limit" id="limit-isha" style="font-size: 8.5px; color: #a7f3d0; opacity: 0.85; text-align: center; line-height: 1;">--</span>
      </div>
    </div>

    <!-- Quick Actions (Does NOT touch New Tab) -->
    <div class="actions-row">
      <button class="btn btn-primary" id="btn-open-dashboard">
        <span class="btn-icon">📊</span> <span id="label-open-dashboard">Open Dashboard</span>
      </button>
      <button class="btn btn-secondary" id="btn-open-settings">
        <span class="btn-icon">⚙️</span> <span id="label-open-settings">Settings</span>
      </button>
    </div>

    <footer class="popup-footer">
      <span id="location-label">Chattogram, Bangladesh (Asia/Dhaka)</span>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
