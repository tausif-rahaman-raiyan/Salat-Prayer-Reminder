      // Defensive guard for third-party browser extensions that attempt `window.fetch = ...` when native fetch has only a getter
      (function() {
        // 1. Error suppressor for external extension scripts attempting to mutate fetch
        window.addEventListener('error', function(event) {
          if (event && event.message && event.message.indexOf('Cannot set property fetch') !== -1) {
            if (typeof event.preventDefault === 'function') event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();
            return true;
          }
        }, true);

        try {
          var _origFetch = window.fetch;
          var fetchDescriptor = {
            configurable: true,
            enumerable: true,
            get: function() { return _origFetch; },
            set: function(val) { _origFetch = val; }
          };

          // Redefine on window directly
          try {
            Object.defineProperty(window, 'fetch', fetchDescriptor);
          } catch (_) {}

          // Redefine on Window.prototype if accessible
          try {
            if (typeof Window !== 'undefined' && Window.prototype) {
              Object.defineProperty(Window.prototype, 'fetch', fetchDescriptor);
            }
          } catch (_) {}

          // Traverse prototype chain to unlock any read-only fetch descriptor
          var proto = window;
          while (proto) {
            try {
              var desc = Object.getOwnPropertyDescriptor(proto, 'fetch');
              if (desc && (desc.configurable || !desc.set)) {
                Object.defineProperty(proto, 'fetch', fetchDescriptor);
              }
            } catch (_) {}
            proto = Object.getPrototypeOf(proto);
          }
        } catch (e) {
          // Silently handle environment sandbox limitations
        }
